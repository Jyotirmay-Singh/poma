name: Mobile checks

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --target-platform android-arm64
      - name: Test native Android alarm policy
        run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poma-android-unit-results
          path: mobile/build/app/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: poma-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

  compile-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --no-codesign
      - name: Test native iOS storage and local alerts
        run: |
          device_id="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; print(next(device["udid"] for devices in json.load(sys.stdin)["devices"].values() for device in devices if device["name"].startswith("iPhone")))')"
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug -destination "platform=iOS Simulator,id=$device_id" CODE_SIGNING_ALLOWED=NO
