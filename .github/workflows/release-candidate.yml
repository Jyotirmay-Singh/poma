name: Release candidate checks

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POMA_ALLOW_UNSIGNED_RELEASE: '1'
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Verify evidence reuse and release metadata
        run: |
          python3 ../scripts/check_release_scope.py
          python3 ../scripts/prepare_release.py --check
          git rev-parse HEAD
          sha256sum pubspec.lock
      - run: flutter pub get --enforce-lockfile
      - name: Check changed Dart formatting and analysis
        run: |
          dart format --output=none --set-exit-if-changed lib/main.dart lib/release_metadata.dart lib/ui/legal_screen.dart lib/ui/settings_screen.dart test/release_ui_test.dart
          flutter analyze --no-pub lib/main.dart lib/release_metadata.dart lib/ui/legal_screen.dart lib/ui/settings_screen.dart test/release_ui_test.dart
      - name: Test changed About and bundled legal screens
        run: flutter test --no-pub test/release_ui_test.dart --reporter expanded
      - name: Package explicitly unsigned inspection artifacts
        run: |
          flutter build apk --release --target-platform android-arm64
          flutter build appbundle --release
          mkdir -p ../artifacts/release-ci
          python3 ../scripts/release_evidence.py archive build/app/outputs/flutter-apk/app-release.apk build/app/outputs/bundle/release/app-release.aab --output ../artifacts/release-ci/android-inventory.json
          flutter --version --machine > ../artifacts/release-ci/flutter.json
          git rev-parse HEAD > ../artifacts/release-ci/source-revision.txt
          sha256sum pubspec.lock > ../artifacts/release-ci/lockfile.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poma-candidate-android-UNSIGNED-inspection
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
            artifacts/release-ci/
          retention-days: 30
  ios-candidate:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - name: Verify unchanged core and metadata
        run: |
          python3 ../scripts/check_release_scope.py
          python3 ../scripts/prepare_release.py --check
      - run: flutter pub get --enforce-lockfile
      - name: Compile simulator and unsigned device release
        run: |
          mkdir -p ../artifacts/release-ci
          sw_vers > ../artifacts/release-ci/macos.txt
          xcodebuild -version > ../artifacts/release-ci/xcode.txt
          flutter --version --machine > ../artifacts/release-ci/flutter.json
          git rev-parse HEAD > ../artifacts/release-ci/source-revision.txt
          shasum -a 256 pubspec.lock > ../artifacts/release-ci/lockfile.sha256
          flutter build ios --simulator --no-codesign
          flutter build ios --release --no-codesign
      - name: Archive without signing; never an installable IPA
        run: |
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$PWD/../artifacts/release-ci/Poma-UNSIGNED.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' | tee ../artifacts/release-ci/archive.log
          if codesign -d --verbose=2 ../artifacts/release-ci/Poma-UNSIGNED.xcarchive/Products/Applications/Runner.app > ../artifacts/release-ci/signature.txt 2>&1; then
            printf '%s\n' 'Unexpected signed root app; inspect signing evidence.'
            exit 1
          fi
          grep -q 'not signed at all' ../artifacts/release-ci/signature.txt
          ditto -c -k --sequesterRsrc --keepParent ../artifacts/release-ci/Poma-UNSIGNED.xcarchive ../artifacts/release-ci/Poma-UNSIGNED.xcarchive.zip
          python3 ../scripts/release_evidence.py archive ../artifacts/release-ci/Poma-UNSIGNED.xcarchive.zip --output ../artifacts/release-ci/ios-inventory.json
          cp .flutter-plugins-dependencies ../artifacts/release-ci/flutter-plugins-dependencies.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poma-candidate-ios-UNSIGNED-macOS-inspection
          path: |
            artifacts/release-ci/*.json
            artifacts/release-ci/*.txt
            artifacts/release-ci/*.sha256
            artifacts/release-ci/*.log
            artifacts/release-ci/*.zip
          retention-days: 30
